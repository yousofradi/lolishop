<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الدفع — </title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/store.css">
  <style>
    .payment-container { width: 100%; max-width: 500px; padding: 12px; box-sizing: border-box; }
    .payment-card { background: #fff; border-radius: 16px; padding: 16px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; gap: 10px; max-height: calc(100dvh - 24px); overflow-y: auto; }
    .success-icon { width: 48px; height: 48px; background: #f0fdf4; color: #16a34a; border-radius: 50%; display: flex; align-items:center; justify-content:center; margin: 0 auto; }
    .method-box { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 12px; margin: 0; position: relative; }
    .method-badge { background: #ef4444; color: #fff; padding: 2px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; margin-left: 8px; }
    .method-number { font-size: 1.3rem; font-weight: 800; color: #1e293b; margin: 8px 0; display: block; }
    .copy-btn { width: 100%; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 8px; font-weight: 700; color: #475569; cursor: pointer; transition: all 0.2s; display: flex; align-items:center; justify-content:center; gap: 6px; font-size: 0.9rem; }
    .copy-btn:active { background: #f1f5f9; }
    .notes-input { width: 100%; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 0.9rem; margin-bottom: 0; transition: border-color 0.2s; resize: none; box-sizing: border-box; }
    .notes-input:focus { outline: none; border-color: var(--primary, var(--primary)); }
    .confirm-btn { width: 100%; background: var(--primary, var(--primary)); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .confirm-btn:hover { background: var(--primary-hover, #7a5a41); }
    .custom-file-upload {
      width: 100%;
      height: 120px;
      margin-bottom: 12px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 12px;
      background-color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .custom-file-upload:hover {
      border-color: #94a3b8;
      background-color: #f1f5f9;
    }
  </style>
</head>
<body style="background: #f8fafc; min-height: 100dvh; margin: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;">

  <div class="payment-container">
    <div class="payment-card">
      <div class="success-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 style="font-size: 1.25rem; margin: 0;">تم استلام طلبك بنجاح!</h2>
      <p class="text-muted" style="font-size:0.9rem; margin:0;" id="order-id-display">رقم الطلب: #...</p>
      <p style="font-size:1.05rem; font-weight:800; color:#1e293b; margin:0;" id="order-total-display">المبلغ الإجمالي: ...</p>

      <div style="text-align:right; margin-top: 4px;">
        <p style="font-weight:700; color:#1e293b; font-size: 0.85rem; margin:0; white-space: pre-wrap; line-height: 1.4;" id="global-payment-notes"></p>
      </div>

      <div id="payment-method-details" class="method-box">
        <!-- Injected dynamically -->
      </div>

      <div style="text-align:right;">
        <label class="form-label" style="font-weight:700; margin-bottom:6px; display:block; font-size: 0.85rem;">إيصال التحويل (اسكرين شوت)</label>
        <div class="custom-file-upload" onclick="document.getElementById('transfer-screenshot').click()">
          <div id="upload-placeholder" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #64748b; gap: 8px;">
            <span style="font-size: 1.5rem; line-height: 1;">+</span>
            <span style="font-size: 0.85rem; font-weight: 600;">إضافة صورة</span>
          </div>
          <img id="upload-preview" src="" style="display: none; width: 100%; height: 100%; object-fit: contain; border-radius: 12px;">
        </div>
        <input type="file" id="transfer-screenshot" accept="image/*" style="display: none;" onchange="previewUpload(this)">

        <label class="form-label" style="font-weight:700; margin-bottom:6px; display:block; font-size: 0.85rem;">رقم الهاتف المحول منه</label>
        <input type="text" id="transfer-number" class="notes-input" placeholder="01234567891" style="margin-bottom: 12px;">

        <label class="form-label" style="font-weight:700; margin-bottom:6px; display:block; font-size: 0.85rem;">ملاحظات التحويل</label>
        <textarea class="notes-input" id="transfer-notes" placeholder="أو اسم المحول..." rows="2"></textarea>
        
        <button class="confirm-btn" onclick="submitTransferInfo()" id="submit-btn">تأكيد وإرسال عبر الواتساب</button>
      </div>
      
      <div style="padding-top:10px; border-top:1px solid #f1f5f9; text-align:right;">
        <p class="text-sm text-muted" style="margin: 0; font-size: 0.8rem;">سيتم مراجعة طلبك فور استلام اسكرين التحويل.</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let currentOrder = null;
    let storeSettings = null;

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id');
      if (!orderId) { window.location.href = 'index'; return; }

      try {
        [currentOrder, storeSettings] = await Promise.all([
          api.getPublicOrder(orderId),
          api.getSetting('loli_global_settings')
        ]);

        if (!currentOrder) { window.location.href = 'index'; return; }

        document.getElementById('order-id-display').textContent = `رقم الطلب: #${currentOrder.orderId}`;
        document.getElementById('order-total-display').textContent = `المبلغ الإجمالي: ${formatPrice(currentOrder.totalPrice)}`;
        document.getElementById('global-payment-notes').textContent = storeSettings.paymentNotes || 'يرجى إتمام عملية التحويل لتأكيد الطلب.';

        renderPaymentDetails();
      } catch (err) {
        console.error(err);
      }
    }

    function renderPaymentDetails() {
      const methods = storeSettings.paymentMethods || [];
      const selected = methods.find(m => m.label === currentOrder.paymentMethod) || methods[0];
      
      if (!selected) {
        document.getElementById('payment-method-details').style.display = 'none';
        return;
      }

      document.getElementById('payment-method-details').innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
           <!-- Circular Logo -->
            <div style="width:48px; height:48px; background:#fff; border:1.5px solid #e2e8f0; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
              ${selected.logo ? `<img src="${api.optimizeImageUrl(selected.logo, 150)}" style="max-width:100%; max-height:100%; object-fit:contain;">` : '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'}
            </div>
           <div style="display:flex; align-items:center; gap:8px;">
              <span class="method-badge" style="margin:0; background: var(--primary, #ef4444);">${selected.label}</span>
           </div>
        </div>
        <span class="method-number" id="pay-number">${selected.number}</span>
        <button class="copy-btn" onclick="copyNumber('${selected.number}')" id="copy-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span style="font-weight: 800;">نسخ الرقم</span>
        </button>
      `;
    }

    function copyNumber(text) {
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copy-btn');
        const original = btn.innerHTML;
        btn.innerHTML = 'تم نسخ الرقم!';
        btn.style.color = '#16a34a';
        btn.style.borderColor = '#16a34a';
        setTimeout(() => {
          btn.innerHTML = original;
          btn.style.color = '';
          btn.style.borderColor = '';
        }, 2000);
      });
    }

    function previewUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('upload-placeholder').style.display = 'none';
          const preview = document.getElementById('upload-preview');
          preview.src = e.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function submitTransferInfo() {
      const notes = document.getElementById('transfer-notes').value.trim();
      const transferNumber = document.getElementById('transfer-number').value.trim();
      const screenshotInput = document.getElementById('transfer-screenshot');
      const file = screenshotInput.files[0];
      const btn = document.getElementById('submit-btn');
      
      btn.disabled = true;
      btn.textContent = 'جاري الحفظ...';

      try {
        let transferScreenshotUrl = null;
        if (file) {
          const formData = new FormData();
          formData.append('image', file);
          if (currentOrder && currentOrder.orderId) {
            formData.append('prefix', currentOrder.orderId);
          }
          const uploadRes = await fetch(`${API_BASE}/upload/public`, {
            method: 'POST',
            body: formData
          });
          if (uploadRes.ok) {
            const uploadData = await uploadRes.json();
            transferScreenshotUrl = uploadData.url;
          }
        }

        // Save to order details
        const updateRes = await fetch(`${API_BASE}/orders/public/${currentOrder.orderId}/transfer-info`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            transferNumber,
            transferNotes: notes,
            transferScreenshot: transferScreenshotUrl
          })
        });

        if (!updateRes.ok) {
          throw new Error('فشل حفظ تفاصيل الدفع');
        }

        // Prepare WhatsApp message
        const subtotal = (currentOrder.items || []).reduce((acc, item) => acc + (item.finalPrice || 0), 0) || (currentOrder.totalPrice - (currentOrder.shippingFee || 0));
        const shipping = currentOrder.shippingFee || 0;
        const total = currentOrder.totalPrice || 0;

        let waMessage = `لقد قمت بطلب اوردر برقم : ${currentOrder.orderId}\n\n`;
        waMessage += `المبلغ الفرعي : ${subtotal} ج.م\n`;
        if (currentOrder.discount && currentOrder.discount > 0) {
          const promoName = currentOrder.appliedPromotionName ? ` (${currentOrder.appliedPromotionName})` : '';
          waMessage += `الخصم${promoName} : -${currentOrder.discount} ج.م\n`;
        }
        waMessage += `مصاريف الشحن : ${shipping === 0 ? 'مجاني' : shipping + ' ج.م'}\n`;
        waMessage += `المبلغ المطلوب (الإجمالي) : ${total} ج.م\n\n`;

        const freeGifts = (currentOrder.items || []).filter(item => item.finalPrice === 0 || item.isFreeGift);
        if (freeGifts.length > 0) {
          waMessage += `لقد حصلت علي هديه مجانيه 🎁\n\n`;
        }
        
        if (transferNumber) {
          waMessage += `تم التحويل من رقم: ${transferNumber}\n`;
        }
        if (notes) {
          waMessage += `ملاحظات التحويل : ${notes}\n\n`;
        }
        waMessage += `يرجى مراجعة التحويل وتأكيد الطلب`;
        
        sessionStorage.setItem('waMessage_' + currentOrder.orderId, waMessage);
        window.location.href = `order-success?id=${currentOrder.orderId}&autoWa=1`;
      } catch (err) {
        console.error(err);
        alert(err.message || 'حدث خطأ أثناء إرسال البيانات. يرجى المحاولة مرة أخرى.');
        btn.disabled = false;
        btn.textContent = 'تأكيد وإرسال عبر الواتساب';
      }
    }

    init();
  </script>
</body>
</html>
